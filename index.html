  { domain: "soft", label: "Know your salary expectations for Indian IT market", priority: "high" },
  { domain: "soft", label: "LinkedIn profile polished and open to work", priority: "good" },
];

const qs = [
  {q:"What is the difference between Continuous Integration, Continuous Delivery, and Continuous Deployment?", a:"CI = developers merge code frequently and automated tests run on every merge. Continuous Delivery = every passing build is automatically prepared and ready to deploy, but a human approves the release. Continuous Deployment = every passing build deploys to production automatically with no human gate. In interviews, always clarify which 'CD' you mean — they're different."},
  {q:"Explain the full flow from a developer pushing code to it being live in production.", a:"Developer pushes to GitHub → GitHub webhook fires a POST to Jenkins → Jenkins checks out the code → installs dependencies → runs Pytest (tests fail: pipeline stops, team notified) → builds a Docker image → pushes image to registry → deploys to AWS (EC2/ECS/Lambda) → CloudWatch monitors logs and triggers alerts if errors spike. This is the answer they want when they say 'walk me through your CI/CD pipeline.'"},
  {q:"What does a Jenkinsfile look like? Write a simple example.", a:"A declarative Jenkinsfile has a pipeline block with agent, environment, and stages. Example: pipeline { agent any; stages { stage('Test') { steps { sh 'pip install -r requirements.txt && pytest' } }; stage('Deploy') { steps { sh './deploy.sh' } } } }. Key point: it lives in the repo, version-controlled alongside the code — called 'pipeline as code'."},
  {q:"What happens if the test stage fails in your pipeline? How do you handle it?", a:"When Pytest fails, Jenkins marks the stage as FAILED, the pipeline stops — no deployment happens. Post-build actions send a Slack/email notification with the build log link. The developer fixes the code and pushes again, re-triggering the pipeline. The key principle: fail fast, fail loudly, never deploy broken code."},
  {q:"What is the difference between blue-green deployment and a canary release?", a:"Blue-green: you run two identical production environments (blue = live, green = new version). You deploy to green, run tests, then switch traffic all at once. Rollback = flip traffic back to blue. Canary: you gradually shift a small percentage of traffic (say 5%) to the new version, watch metrics, then slowly ramp to 100%. Canary is safer for large user bases; blue-green is simpler to manage."},
];

let checked = new Set();
try {
  // Check URL parameters first for shared state
  const urlParams = new URLSearchParams(window.location.search);
  const sharedState = urlParams.get('state');
  if (sharedState) {
    const arr = sharedState.split(',').map(Number).filter(n => !isNaN(n));
    checked = new Set(arr);
    // Save to local storage so it persists
    localStorage.setItem('devops_checklist_checked', JSON.stringify(arr));
    // Clean up URL parameter without reloading
    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
    window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
  } else {
    // Otherwise load from local storage
    const saved = localStorage.getItem('devops_checklist_checked');
    if (saved) {
      const arr = JSON.parse(saved);
      if (Array.isArray(arr)) {
        checked = new Set(arr);
      }
    }
  }
} catch (e) {
  console.error('Failed to load checklist state:', e);
}

function saveState() {
  try {
    localStorage.setItem('devops_checklist_checked', JSON.stringify(Array.from(checked)));
  } catch (e) {
    console.error('Failed to save checklist state:', e);
  }
}

function shareProgress() {
  const state = Array.from(checked).join(',');
  const url = window.location.href.split('?')[0] + '?state=' + encodeURIComponent(state);
  navigator.clipboard.writeText(url).then(() => {
    alert('Shareable link copied to clipboard! Open this link on your other device to sync your progress.');
  }).catch(err => {
    prompt('Copy this shareable link:', url);
  });
}

function exportProgress() {
  const state = btoa(JSON.stringify(Array.from(checked)));
  navigator.clipboard.writeText(state).then(() => {
    alert('Progress code copied to clipboard! You can paste this code on another device.');
  }).catch(err => {
    prompt('Copy your progress code:', state);
  });
}

function importProgress() {
  const code = prompt('Paste your progress code here:');
  if (!code) return;
  try {
    const arr = JSON.parse(atob(code.trim()));
    if (Array.isArray(arr)) {
      checked = new Set(arr);
      saveState();
      renderChecklist(currentTab);
      alert('Progress imported successfully!');
    } else {
      alert('Invalid progress code.');
    }
  } catch (e) {
    alert('Failed to import progress. Please make sure the code is valid.');
  }
}


function renderChecklist(filter) {
  const area = document.getElementById('checklist-area');

  const groups = {};
  filtered.forEach((item, idx) => {

            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>

        <g class="node c-purple" onclick="sendPrompt('Explain CI CD code stage in detail')">
          <rect x="20" y="60" width="108" height="80" rx="8" stroke-width="0.5"/>
          <text class="th" x="74" y="95" text-anchor="middle" dominant-baseline="central">Code</text>
          <text class="ts" x="74" y="118" text-anchor="middle" dominant-baseline="central">Git push / PR</text>
        </g>

        <line x1="128" y1="100" x2="154" y2="100" class="arr" marker-end="url(#arrow)" stroke="#7F77DD"/>

        <g class="node c-blue" onclick="sendPrompt('Explain CI CD build stage in detail')">
          <rect x="154" y="60" width="108" height="80" rx="8" stroke-width="0.5"/>
          <text class="th" x="208" y="95" text-anchor="middle" dominant-baseline="central">Build</text>
          <text class="ts" x="208" y="118" text-anchor="middle" dominant-baseline="central">Jenkins trigger</text>
        </g>

        <line x1="262" y1="100" x2="288" y2="100" class="arr" marker-end="url(#arrow)" stroke="#378ADD"/>

        <g class="node c-teal" onclick="sendPrompt('Explain CI CD test stage in detail')">
          <rect x="288" y="60" width="108" height="80" rx="8" stroke-width="0.5"/>
          <text class="th" x="342" y="95" text-anchor="middle" dominant-baseline="central">Test</text>
          <text class="ts" x="342" y="118" text-anchor="middle" dominant-baseline="central">Pytest / lint</text>
        </g>

        <line x1="396" y1="100" x2="422" y2="100" class="arr" marker-end="url(#arrow)" stroke="#1D9E75"/>

        <g class="node c-amber" onclick="sendPrompt('Explain CI CD deploy stage in detail')">
          <rect x="422" y="60" width="108" height="80" rx="8" stroke-width="0.5"/>
          <text class="th" x="476" y="95" text-anchor="middle" dominant-baseline="central">Deploy</text>
          <text class="ts" x="476" y="118" text-anchor="middle" dominant-baseline="central">AWS / Docker</text>
        </g>

        <line x1="530" y1="100" x2="556" y2="100" class="arr" marker-end="url(#arrow)" stroke="#BA7517"/>

        <g class="node c-coral" onclick="sendPrompt('Explain CI CD monitor stage in detail')">
          <rect x="556" y="60" width="108" height="80" rx="8" stroke-width="0.5"/>
          <text class="th" x="610" y="95" text-anchor="middle" dominant-baseline="central">Monitor</text>
          <text class="ts" x="610" y="118" text-anchor="middle" dominant-baseline="central">CloudWatch</text>
        </g>

        <rect x="20" y="175" width="644" height="0.5" fill="var(--color-border-tertiary)"/>
        <text class="ts" x="342" y="195" text-anchor="middle" dominant-baseline="central">Your tools in each stage</text>

        <g class="c-purple">
          <rect x="20" y="210" width="108" height="36" rx="6" stroke-width="0.5"/>
          <text class="ts" x="74" y="228" text-anchor="middle" dominant-baseline="central">Git + GitHub</text>
        </g>
        <g class="c-blue">
          <rect x="154" y="210" width="108" height="36" rx="6" stroke-width="0.5"/>
          <text class="ts" x="208" y="228" text-anchor="middle" dominant-baseline="central">Jenkins</text>
        </g>
        <g class="c-teal">
          <rect x="288" y="210" width="108" height="36" rx="6" stroke-width="0.5"/>
          <text class="ts" x="342" y="228" text-anchor="middle" dominant-baseline="central">Pytest + Python</text>
        </g>
        <g class="c-amber">
          <rect x="422" y="210" width="108" height="36" rx="6" stroke-width="0.5"/>
          <text class="ts" x="476" y="228" text-anchor="middle" dominant-baseline="central">AWS EC2/S3</text>
        </g>
        <g class="c-coral">
          <rect x="556" y="210" width="108" height="36" rx="6" stroke-width="0.5"/>
          <text class="ts" x="610" y="228" text-anchor="middle" dominant-baseline="central">CloudWatch</text>
        </g>

        <text class="ts" x="342" y="275" text-anchor="middle" dominant-baseline="central">What triggers the pipeline?</text>

        <g class="node c-gray" onclick="sendPrompt('Explain how GitHub webhooks trigger Jenkins pipeline')">
          <rect x="155" y="290" width="370" height="44" rx="8" stroke-width="0.5"/>
          <text class="th" x="340" y="308" text-anchor="middle" dominant-baseline="central">GitHub Webhook</text>
          <text class="ts" x="340" y="325" text-anchor="middle" dominant-baseline="central">HTTP POST to Jenkins on every push or PR</text>
        </g>

        <line x1="340" y1="334" x2="340" y2="360" class="arr" marker-end="url(#arrow)"/>

        <g class="node c-blue" onclick="sendPrompt('What does a Jenkinsfile look like for a Python project?')">
          <rect x="155" y="360" width="370" height="44" rx="8" stroke-width="0.5"/>
          <text class="th" x="340" y="378" text-anchor="middle" dominant-baseline="central">Jenkinsfile runs</text>
          <text class="ts" x="340" y="395" text-anchor="middle" dominant-baseline="central">install → pytest → docker build → deploy</text>
        </g>

        <line x1="340" y1="404" x2="340" y2="430" class="arr" marker-end="url(#arrow)"/>

        <g class="node c-teal" onclick="sendPrompt('What happens when tests fail in a Jenkins pipeline?')">
          <rect x="155" y="430" width="370" height="36" rx="8" stroke-width="0.5"/>
          <text class="ts" x="340" y="448" text-anchor="middle" dominant-baseline="central">Pass → deploy to AWS &nbsp;|&nbsp; Fail → notify team, block deploy</text>

  html += order.filter(o => groups[o]).map(o => `
    <div class="card">
      <div class="sec-title">
        <span class="badge ${o}">${o === 'must' ? 'Must know' : o === 'high' ? 'High value' : 'Good to have'}</span>
        <span style="font-size:12px; color:var(--color-text-secondary); font-weight:400">${labels[o]}</span>
      </div>
      ${groups[o].map(item => `
        <div class="point">
          <input type="checkbox" id="cb-${item.idx}" ${checked.has(item.idx) ? 'checked' : ''} onchange="toggle(${item.idx})">
          <label for="cb-${item.idx}" class="${checked.has(item.idx) ? 'done' : ''}">${item.label}</label>
        </div>
      `).join('')}
    </div>
  `).join('');

  // Add the Q&A section if it's the cicd tab
  if (filter === 'cicd') {
    html += `
    <div style="margin-top: 20px;">
      <h3 style="font-size: 14px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 8px;">Interview questions</h3>
      <p style="font-size:13px;color:var(--color-text-secondary);margin:0 0 14px">Tap any question to reveal the model answer. Say it out loud.</p>
      <div class="card">
        ${qs.map((q, i) => `
          <div class="q-text" onclick="toggleQ(this)">
            <span>Q${i+1}. ${q.q}</span>
            <span class="chev">&#8964;</span>
          </div>
          <div class="q-ans">${q.a}</div>
        `).join('')}
      </div>
      <button onclick="sendPrompt('Give me 5 more advanced CI/CD interview questions with answers')" style="margin-top:4px">More questions ↗</button>
    </div>
    `;
  }

  area.innerHTML = html;
  updateStats();
}

function toggle(idx) {
  if (checked.has(idx)) checked.delete(idx);
  else checked.add(idx);
  const lbl = document.querySelector(`label[for="cb-${idx}"]`);
  if (lbl) lbl.className = checked.has(idx) ? 'done' : '';
  saveState();
  updateStats();
}

function updateStats() {
  const total = data.length;
  const done = checked.size;
  const pct = Math.round((done / total) * 100);
  document.getElementById('done-count').textContent = done;
  document.getElementById('total-count').textContent = total;
  document.getElementById('pct-count').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
}

let currentTab = 'all';
function showTab(t) {
  currentTab = t;
  document.querySelectorAll('.skill-tab').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  renderChecklist(t);
}

function resetAll() {
  checked.clear();
  saveState();
  renderChecklist(currentTab);
}

function toggleQ(el) {
  const ans = el.nextElementSibling;
  const chev = el.querySelector('.chev');
  const open = ans.style.display==='block';
  ans.style.display=open?'none':'block';
  chev.classList.toggle('open',!open);
}

renderChecklist('all');
updateStats();
</script>
